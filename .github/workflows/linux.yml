name: linux-ci

on:
  push:
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./internal/protocol/... ./internal/crypto/... ./internal/clipboard/... ./internal/keymap/... ./internal/util/... ./tests/...
  full:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: apt deps (22.04 floor)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxi-dev libxfixes-dev
      - run: CGO_ENABLED=1 go vet ./...
      - run: CGO_ENABLED=1 go test ./...
      - run: CGO_ENABLED=1 go build ./...
